name: Build and scan an on-prem image
description: Build one OCI archive without publishing credentials, test it and scan it once
inputs:
  image:
    description: Local image tag, retained in the release archive
    required: true
  dockerfile:
    description: Dockerfile in the checked-out source
    required: true
  context:
    description: Build context
    default: .
  platform:
    description: Native target platform
    default: linux/amd64
  security-config:
    description: Component-specific Trivy policy, empty for the default policy
    default: ''
  cuda:
    description: Reclaim disposable runner toolchains for a CUDA image
    default: 'false'
  evidence-name:
    description: Unique artifact name for the scan report and policy
    required: true
  artifact-name:
    description: If set, export the scanned archive and SBOM for a separate publisher
    default: ''
runs:
  using: composite
  steps:
    - name: Prepare the disposable Docker runner
      shell: bash
      run: python3 .github/scripts/configure-onprem-ci-dns.py --docker --oci
    - name: Reserve disk for CUDA
      if: inputs.cuda == 'true'
      shell: bash
      run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /opt/az
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build and verify the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT: ${{ inputs.context }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        docker buildx build --provenance=false \
          --output "type=oci,dest=$RUNNER_TEMP/scan-image,tar=false,compression=gzip,force-compression=true" \
          --platform "$PLATFORM" \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          -t "$IMAGE" -f "$DOCKERFILE" "$BUILD_CONTEXT"
        # Drop BuildKit's extracted layers before Docker creates its own copy.
        docker buildx prune --all --force
        tar -C "$RUNNER_TEMP/scan-image" -cf - . | docker load
        container=$(docker create "$IMAGE")
        trap 'docker rm -f "$container" >/dev/null' EXIT
        docker cp "$container:/usr/share/licenses/videoq/LICENSE" - | tar -xO | cmp LICENSE -
        if [ "$DOCKERFILE" = apps/inference/whisper/Dockerfile ]; then
          docker run --rm --entrypoint python "$IMAGE" -c 'import server, provision, silero_vad, torch'
        fi
        # NVIDIA runtime imports are already checked by RUN as the image user.
        docker rm "$container" >/dev/null
        trap - EXIT
        docker image rm "$IMAGE"
        mkdir -p artifact
        df -h /
    - name: Scan the complete image including unfixed vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.35.0
      with:
        version: v0.76.1
        scan-type: image
        input: ${{ runner.temp }}/scan-image
        trivy-config: ${{ inputs.security-config }}
        format: json
        output: artifact/security.json
        list-all-pkgs: 'true'
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: 'false'
        exit-code: '1'
        timeout: 15m
    - name: Retain scan evidence on success or failure
      if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.evidence-name }}
        path: |
          artifact/security.json
          apps/inference/whisper/security/
        if-no-files-found: error
        retention-days: 90
    - name: Prepare the scanned archive and inventory for publication
      if: inputs.artifact-name != ''
      shell: bash
      run: |
        # Reuse the complete scan inventory instead of scanning the CUDA layers again.
        trivy convert --format cyclonedx --output artifact/sbom.cdx.json artifact/security.json
        tar -C "$RUNNER_TEMP/scan-image" -cf - . | zstd -T0 -o artifact/image.tar.zst
    - name: Hand the scanned image to a separate publisher
      if: inputs.artifact-name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: artifact
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
