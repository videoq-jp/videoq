name: Build and scan an on-prem image
description: Build one OCI archive without publishing credentials, test it and scan it once
inputs:
  image:
    description: Local image tag, retained in the release archive
    required: true
  dockerfile:
    description: Dockerfile in the checked-out source
    required: true
  context:
    description: Build context
    default: .
  platform:
    description: Native target platform
    default: linux/amd64
  security-config:
    description: Component-specific Trivy policy, empty for the default policy
    default: ''
  cuda:
    description: Reclaim disposable runner toolchains for a CUDA image
    default: 'false'
  evidence-name:
    description: Unique artifact name for the scan report and policy
    required: true
  artifact-name:
    description: If set, export the scanned archive and SBOM for a separate publisher
    default: ''
runs:
  using: composite
  steps:
    - name: Prepare the disposable Docker runner
      shell: bash
      run: python3 .github/scripts/configure-onprem-ci-dns.py --docker
    - name: Reserve disk for CUDA
      if: inputs.cuda == 'true'
      shell: bash
      run: |
        # This action runs on a fresh hosted runner, with no service containers.
        # Keep the tool-cache directory/ownership so later setup actions can reuse it.
        df -h / "$RUNNER_TEMP"
        docker system prune --all --force --volumes
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup /opt/az /usr/lib/jvm /usr/share/miniconda /opt/pipx
        if [ -d /opt/hostedtoolcache ]; then
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 -exec rm -rf '{}' +
        fi
        while IFS= read -r swap_file; do
          if [ -f "$swap_file" ] && [ ! -L "$swap_file" ]; then
            sudo swapoff "$swap_file"
            sudo rm -f "$swap_file"
          fi
        done < <(swapon --show=NAME --noheadings)
        /usr/bin/python3 - <<'PYCODE'
        import os, shutil
        minimum = 60 * 1024**3
        free = min(shutil.disk_usage(p).free for p in ['/var/lib/docker', os.environ['RUNNER_TEMP']])
        print(f"CUDA build workspace: {free / 1024**3:.1f} GiB free; requires 60 GiB")
        if free < minimum:
            raise SystemExit("Insufficient disk for the CUDA build before downloading its layers")
        PYCODE
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
    - name: Build and verify the image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        DOCKERFILE: ${{ inputs.dockerfile }}
        BUILD_CONTEXT: ${{ inputs.context }}
        PLATFORM: ${{ inputs.platform }}
      run: |
        docker buildx build --provenance=false \
          --output "type=oci,dest=$RUNNER_TEMP/scan-image,tar=false,compression=gzip,force-compression=true" \
          --platform "$PLATFORM" \
          --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
          --label "org.opencontainers.image.revision=$GITHUB_SHA" \
          -t "$IMAGE" -f "$DOCKERFILE" "$BUILD_CONTEXT"
        # Inspect the exact OCI output with BuildKit; do not create a second image store.
        manifest=$(/usr/bin/python3 -c 'import json,os,re; x=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"scan-image/index.json")))["manifests"]; assert len(x)==1; d=x[0]["digest"]; assert re.fullmatch("sha256:[a-f0-9]{64}",d); print(d)')
        mkdir -p "$RUNNER_TEMP/image-check-context"
        printf 'FROM release-image AS checked\n' > "$RUNNER_TEMP/image-check.Dockerfile"
        if [ "$DOCKERFILE" = apps/inference/whisper/Dockerfile ]; then
          printf 'RUN ["python", "-c", "import server, provision, silero_vad, torch"]\n' >> "$RUNNER_TEMP/image-check.Dockerfile"
        fi
        printf 'FROM scratch\nCOPY --from=checked /usr/share/licenses/videoq/LICENSE /LICENSE\n' >> "$RUNNER_TEMP/image-check.Dockerfile"
        docker buildx build --provenance=false --platform "$PLATFORM" \
          --build-context "release-image=oci-layout://$RUNNER_TEMP/scan-image@$manifest" \
          --output "type=local,dest=$RUNNER_TEMP/image-check" \
          -f "$RUNNER_TEMP/image-check.Dockerfile" "$RUNNER_TEMP/image-check-context"
        cmp LICENSE "$RUNNER_TEMP/image-check/LICENSE"
        # NVIDIA runtime imports are already checked by RUN as the image user.
        docker buildx prune --all --force
        mkdir -p artifact
        df -h /
    - name: Scan the complete image including unfixed vulnerabilities
      id: scan
      uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.35.0
      with:
        version: v0.76.1
        scan-type: image
        input: ${{ runner.temp }}/scan-image
        trivy-config: ${{ inputs.security-config }}
        format: json
        output: artifact/security.json
        list-all-pkgs: 'true'
        scanners: vuln
        severity: HIGH,CRITICAL
        ignore-unfixed: 'false'
        exit-code: '1'
        timeout: 15m
    - name: Retain scan evidence on success or failure
      if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.evidence-name }}
        path: |
          artifact/security.json
          apps/inference/whisper/security/
        if-no-files-found: error
        retention-days: 90
    - name: Prepare the scanned image and inventory for publication
      if: inputs.artifact-name != ''
      shell: bash
      run: |
        # Reuse the complete scan inventory instead of scanning the CUDA layers again.
        trivy convert --format cyclonedx --output artifact/sbom.cdx.json artifact/security.json
        mv "$RUNNER_TEMP/scan-image" artifact/image
    - name: Hand the scanned image to a separate publisher
      if: inputs.artifact-name != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: artifact
        compression-level: 0
        if-no-files-found: error
        retention-days: 1
