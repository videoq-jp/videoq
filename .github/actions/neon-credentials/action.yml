name: Authenticate to Neon parameter store
description: Obtain temporary AWS credentials for the production database parameter only.
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_NEON_ROLE_ARN }}
        aws-region: ap-northeast-1
        role-session-name: videoq-neon-${{ github.run_id }}
