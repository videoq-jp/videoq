name: Authenticate for AWS database operation requests
description: Obtain temporary credentials that can invoke only the fixed AWS starter function.
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ env.AWS_DB_REQUEST_ROLE_ARN }}
        aws-region: ap-northeast-1
        role-session-name: videoq-db-request-${{ github.run_id }}
        role-duration-seconds: 7200
