name: Initialize Neon Maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-db-maintenance
  cancel-in-progress: false
jobs:
  initialize:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-infra
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_NEON_BOOTSTRAP_ROLE_ARN }}
          role-session-name: videoq-neon-initialize-${{ github.run_id }}
          aws-region: ap-northeast-1
      - name: Initialize the dedicated Hyperdrive credential store
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_TOKEN }}
        run: node .github/scripts/neon-bootstrap.cjs
