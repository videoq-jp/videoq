name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push')
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      api: ${{ steps.resolve.outputs.api }}
      worker: ${{ steps.resolve.outputs.worker }}
      migrate: ${{ steps.resolve.outputs.migrate }}
      docs: ${{ steps.resolve.outputs.docs }}
      web: ${{ steps.resolve.outputs.web }}
    steps:
      # Read the policy from the trusted workflow revision, not the CI head SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Validate production deployment source
        id: validate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const validate = require('./.github/scripts/validate-deployment.cjs');
            core.setOutput('sha', await validate({ github, context }));
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      # Compare from the last successfully completed CD run. HEAD^1 misses
      # earlier commits in a multi-commit push and changes whose CI run was
      # cancelled by a newer push.
      - name: Resolve paths-filter base
        id: path_base
        if: github.event_name != 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const headSha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd.yml',
              branch: 'main',
              status: 'completed',
              per_page: 100,
            });
            const previous = data.workflow_runs.find(
              (run) => run.conclusion === 'success',
            );
            if (previous) {
              core.info(`Comparing ${previous.head_sha}..${headSha}`);
              core.setOutput('sha', previous.head_sha);
              return;
            }

            const root = await exec.getExecOutput(
              'git',
              ['rev-list', '--max-parents=0', headSha],
              { silent: true },
            );
            const rootSha = root.stdout.trim();
            if (!rootSha) {
              core.setFailed('Unable to resolve a paths-filter base SHA');
              return;
            }
            core.info(`No successful CD run found; comparing ${rootSha}..${headSha}`);
            core.setOutput('sha', rootSha);
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ steps.path_base.outputs.sha }}
          ref: ${{ github.sha }}
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            api:
              - 'apps/api/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            worker:
              - 'apps/worker/**'
              # A migration can rename objects used by the Python worker. If a
              # coordinated deploy is blocked on migration and the follow-up
              # only fixes SQL, redeploy the worker too so production cannot
              # remain on the pre-migration schema contract.
              - 'apps/api/drizzle/**'
              - 'apps/api/src/db/**'
              - 'apps/api/drizzle.config.ts'
              - 'apps/api/scripts/db-migrate.sh'
              - 'apps/api/scripts/migrate-database.ts'
              - 'apps/api/scripts/migrations/**'
              - 'apps/api/scripts/purge-retired-study-data.mjs'
              - 'apps/api/scripts/stamp-baseline.mjs'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            migrate:
              - 'apps/api/drizzle/**'
              - 'apps/api/src/db/**'
              - 'apps/api/drizzle.config.ts'
              - 'apps/api/scripts/db-migrate.sh'
              - 'apps/api/scripts/migrate-database.ts'
              - 'apps/api/scripts/migrations/**'
              - 'apps/api/scripts/purge-retired-study-data.mjs'
              - 'apps/api/scripts/stamp-baseline.mjs'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - '.github/scripts/**'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
      - name: Resolve deploy flags
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "api=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "migrate=true" >> "$GITHUB_OUTPUT"
            echo "docs=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "worker=${{ steps.filter.outputs.worker }}" >> "$GITHUB_OUTPUT"
            echo "migrate=${{ steps.filter.outputs.migrate }}" >> "$GITHUB_OUTPUT"
            echo "docs=${{ steps.filter.outputs.docs }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  application-build:
    name: Build application without production credentials
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.docs == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - name: Build API Worker
        if: needs.changes.outputs.api == 'true'
        run: |
          mkdir -p deploy-artifacts/api/worker
          node node_modules/wrangler/bin/wrangler.js deploy --config apps/api/wrangler.jsonc --env production --minify --dry-run --outdir "$GITHUB_WORKSPACE/deploy-artifacts/api/worker"
      - name: Build web application and Worker
        if: needs.changes.outputs.web == 'true'
        run: |
          npm run build --workspace @videoq/web
          mkdir -p deploy-artifacts/web/worker
          cp -R apps/web/dist deploy-artifacts/web/assets
          node node_modules/wrangler/bin/wrangler.js deploy --config apps/web/wrangler.jsonc --env production --dry-run --outdir "$GITHUB_WORKSPACE/deploy-artifacts/web/worker"
      - name: Build and validate documentation
        if: needs.changes.outputs.docs == 'true'
        run: |
          npm run typecheck --workspace @videoq/docs
          npm run build:docs
          mkdir -p deploy-artifacts/docs
          cp -R apps/docs/build deploy-artifacts/docs/assets
      - name: Upload prebuilt application
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: application-${{ needs.changes.outputs.sha }}
          path: deploy-artifacts
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  web-deploy:
    name: Deploy web (prebuilt Cloudflare artifact)
    runs-on: ubuntu-latest
    environment: production-app
    timeout-minutes: 15
    needs: [changes, application-build, api-deploy]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.application-build.result == 'success' &&
      needs.changes.outputs.web == 'true' &&
      (needs.changes.outputs.api != 'true' || needs.api-deploy.result == 'success')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install separately locked deployment tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/deploy-tools
      - name: Verify deployment tool signatures
        working-directory: .github/deploy-tools
        run: npm audit signatures
      - name: Download this run's immutable application artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-${{ needs.changes.outputs.sha }}
          path: deploy-artifacts
      - name: Generate upload-only config from trusted main
        run: node .github/scripts/deployment-config.cjs web deploy-artifacts deployment.json
      - name: Upload prebuilt Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node .github/deploy-tools/node_modules/wrangler/bin/wrangler.js deploy --config deployment.json --no-bundle --no-autoconfig --env-file /dev/null

  docs-deploy:
    name: Deploy docs (prebuilt Cloudflare artifact)
    runs-on: ubuntu-latest
    environment: production-app
    timeout-minutes: 15
    needs: [changes, application-build]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.application-build.result == 'success' &&
      needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install separately locked deployment tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/deploy-tools
      - name: Verify deployment tool signatures
        working-directory: .github/deploy-tools
        run: npm audit signatures
      - name: Download this run's immutable application artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-${{ needs.changes.outputs.sha }}
          path: deploy-artifacts
      - name: Generate upload-only config from trusted main
        run: node .github/scripts/deployment-config.cjs docs deploy-artifacts deployment.json
      - name: Upload prebuilt Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node .github/deploy-tools/node_modules/wrangler/bin/wrangler.js deploy --config deployment.json --no-bundle --no-autoconfig --env-file /dev/null

  api-deploy:
    name: Deploy api (prebuilt Cloudflare artifact)
    runs-on: ubuntu-latest
    environment: production-app
    timeout-minutes: 15
    needs: [changes, application-build, db-migrate]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.application-build.result == 'success' &&
      needs.changes.outputs.api == 'true' &&
      (needs.changes.outputs.migrate != 'true' || needs.db-migrate.result == 'success')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install separately locked deployment tools without lifecycle scripts
        run: npm ci --ignore-scripts --prefix .github/deploy-tools
      - name: Verify deployment tool signatures
        working-directory: .github/deploy-tools
        run: npm audit signatures
      - name: Download this run's immutable application artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: application-${{ needs.changes.outputs.sha }}
          path: deploy-artifacts
      - name: Generate upload-only config from trusted main
        run: node .github/scripts/deployment-config.cjs api deploy-artifacts deployment.json
      - name: Upload prebuilt Worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          node .github/deploy-tools/node_modules/wrangler/bin/wrangler.js deploy --config deployment.json --no-bundle --no-autoconfig --env-file /dev/null

  db-migrate:
    name: Drizzle DB Migrate
    runs-on: ubuntu-latest
    environment: production-db-migration
    concurrency:
      group: production-db-maintenance
      cancel-in-progress: false
    timeout-minutes: 125
    needs: [changes]
    if: needs.changes.outputs.migrate == 'true'
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DB_REQUEST_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_DB_REQUEST_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/aws-db-invocation
      - name: Request the canonical-main migration in AWS
        env:
          STRUCTURED_ANSWER_WRITERS_STOPPED: ${{ vars.STRUCTURED_ANSWER_WRITERS_STOPPED }}
        run: python3 .github/scripts/run-aws-db.py migration

  worker-build:
    name: Build Lambda image without AWS credentials
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.worker == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build local ARM64 image
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.sha }}
        run: |
          docker build --platform linux/arm64 -t "videoq-worker:$SOURCE_SHA" apps/worker
          docker save "videoq-worker:$SOURCE_SHA" | zstd -T0 -o worker-image.tar.zst
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-${{ needs.changes.outputs.sha }}
          path: worker-image.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  worker-deploy:
    name: Deploy prebuilt Worker Lambda image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    # Deploy readers before the worker can write a new shared data format.
    needs: [changes, worker-build, db-migrate, api-deploy, web-deploy]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      needs.worker-build.result == 'success' &&
      needs.changes.outputs.worker == 'true' &&
      (needs.changes.outputs.migrate != 'true' || needs.db-migrate.result == 'success') &&
      (needs.changes.outputs.api != 'true' || needs.api-deploy.result == 'success') &&
      (needs.changes.outputs.web != 'true' || needs.web-deploy.result == 'success')
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: worker-${{ needs.changes.outputs.sha }}
      - name: Load image without executing it
        run: zstd -d worker-image.tar.zst --stdout | docker load
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_DEPLOY_ROLE_ARN }}
          role-session-name: videoq-worker-deploy
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - name: Push prebuilt image and update Lambda
        env:
          SOURCE_SHA: ${{ needs.changes.outputs.sha }}
          IMAGE_REPOSITORY: ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_WORKER }}
          FUNCTION_NAME: ${{ secrets.LAMBDA_WORKER_FUNCTION_NAME }}
        run: |
          docker tag "videoq-worker:$SOURCE_SHA" "$IMAGE_REPOSITORY:$SOURCE_SHA"
          docker tag "videoq-worker:$SOURCE_SHA" "$IMAGE_REPOSITORY:latest"
          docker push "$IMAGE_REPOSITORY:$SOURCE_SHA"
          docker push "$IMAGE_REPOSITORY:latest"
          aws lambda update-function-code --function-name "$FUNCTION_NAME" --image-uri "$IMAGE_REPOSITORY:$SOURCE_SHA"
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
