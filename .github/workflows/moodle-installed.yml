name: Moodle installed acceptance
on:
  workflow_call:
permissions:
  contents: read
jobs:
  installed:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Validate fixture isolation and immutable source pins
        run: python3 -m unittest discover -s .github/scripts -p test_moodle_cpu.py -v
      - name: Install host media encoder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install checksum-pinned kind
        run: KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Prepare public commit-pinned Moodle sources
        run: python3 .github/scripts/moodle-cpu-sources.py "$RUNNER_TEMP/moodle-build"
      - name: Build the test-only Moodle image
        run: |
          python3 - <<'PY'
          import importlib.util, os, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('pins', '.github/scripts/moodle-cpu-sources.py')
          pins = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pins)
          value = pins.read_pins()
          subprocess.run(['docker', 'build', '--build-arg', 'PHP_IMAGE=' + value['phpImage'],
              '--build-arg', 'MOODLE_REVISION=' + value['moodle']['revision'],
              '--build-arg', 'COMPANION_REVISION=' + value['companion']['revision'],
              '-t', 'videoq-moodle:cpu-acceptance', str(Path(os.environ['RUNNER_TEMP']) / 'moodle-build')], check=True)
          PY
      - name: Exercise actual Moodle roles, enrolment, visibility and private HTTPS
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          python3 .github/scripts/moodle-install-acceptance.py "$RUNNER_TEMP/moodle-installed"
      - name: Retain only public fixture evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moodle-installed-${{ github.sha }}
          path: |
            ${{ runner.temp }}/moodle-build/source-identities.json
            ${{ runner.temp }}/moodle-installed/result.json
            ${{ runner.temp }}/moodle-installed/cleanup.json
            ${{ runner.temp }}/moodle-installed/node-transport.json
            ${{ runner.temp }}/moodle-installed/diagnostics.json
            ${{ runner.temp }}/moodle-installed/private/failure-summary.json
          if-no-files-found: warn
          retention-days: 14

  real-cpu:
    name: Moodle with actual CPU inference
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Require combined fixture capacity before provisioning
        run: |
          python3 - <<'PY'
          import importlib.util, subprocess
          spec = importlib.util.spec_from_file_location('cpu', '.github/scripts/onprem-cpu-acceptance.py')
          cpu = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cpu)
          cpu.require_docker_memory(int(subprocess.check_output(['docker', 'info', '--format', '{{.MemTotal}}'])), moodle=True)
          PY
      - name: Reserve disk on the disposable test runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api --workspace @videoq/web
      - name: Check public browser diagnostic boundaries
        run: node --test .github/moodle-cpu/browser-evidence.test.mjs .github/moodle-cpu/native-browser.test.mjs .github/moodle-cpu/native-stream.test.mjs
      - name: Install checksum-pinned Helm and kind
        run: |
          HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
          KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Install the actual browser
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Check actual streamed-response observation and cancellation
        run: node --test .github/moodle-cpu/native-stream-browser.test.mjs
      - name: Prepare pinned Moodle source context
        run: python3 .github/scripts/moodle-cpu-sources.py "$RUNNER_TEMP/moodle-build"
      - name: Check original-session refusal with the actual Moodle AJAX client
        run: VIDEOQ_MOODLE_SOURCE="$RUNNER_TEMP/moodle-build/moodle" node --test .github/moodle-cpu/native-session-browser.test.mjs
      - name: Build actual application and inference adapter images
        run: |
          docker build -t videoq-api:onprem-ci -f apps/api/Dockerfile .
          docker build -t videoq-worker:onprem-ci -f apps/worker/Dockerfile.onprem apps/worker
          docker build -t videoq-web:onprem-ci -f apps/web/Dockerfile .
          docker build -t videoq-local-whisper:onprem-ci apps/inference/whisper
          python3 - <<'PY'
          import importlib.util, os, subprocess
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('pins', '.github/scripts/moodle-cpu-sources.py')
          pins = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(pins)
          value = pins.read_pins()
          subprocess.run(['docker', 'build', '--build-arg', 'PHP_IMAGE=' + value['phpImage'],
              '--build-arg', 'MOODLE_REVISION=' + value['moodle']['revision'],
              '--build-arg', 'COMPANION_REVISION=' + value['companion']['revision'],
              '-t', 'videoq-moodle:cpu-acceptance', str(Path(os.environ['RUNNER_TEMP']) / 'moodle-build')], check=True)
          PY
      - name: Exercise real CPU lifecycle then Moodle owner, teacher and learner flows
        env:
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('cpu', '.github/scripts/onprem-cpu-acceptance.py')
          cpu = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(cpu)
          output = Path(os.environ['RUNNER_TEMP']) / 'moodle-real-cpu'
          images = {c: 'videoq-' + c + ':onprem-ci' for c in ['api', 'worker', 'web']}
          images['whisper'] = 'videoq-local-whisper:onprem-ci'
          result = cpu.rehearse(os.environ['GITHUB_SHA'], Path('charts/videoq'), Path('charts/videoq-inference'),
              output, images, local_builds=True, moodle_image='videoq-moodle:cpu-acceptance')
          result['verification'] = 'Actual source-build Moodle and real CPU inference; not signed-release verification'
          cpu.release.write_atomic(output / 'result.json', result)
          PY
      - name: Retain only public fixture acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: moodle-real-cpu-${{ github.sha }}
          path: |
            ${{ runner.temp }}/moodle-build/source-identities.json
            ${{ runner.temp }}/moodle-real-cpu/result.json
            ${{ runner.temp }}/moodle-real-cpu/real-ai-result.json
            ${{ runner.temp }}/moodle-real-cpu/playback.json
            ${{ runner.temp }}/moodle-real-cpu/diagnostics.json
            ${{ runner.temp }}/moodle-real-cpu/moodle-result.json
            ${{ runner.temp }}/moodle-real-cpu/moodle-stage.json
            ${{ runner.temp }}/moodle-real-cpu/moodle-native-mobile.png
            ${{ runner.temp }}/moodle-real-cpu/moodle-private/failure-summary.json
          if-no-files-found: warn
          retention-days: 14
