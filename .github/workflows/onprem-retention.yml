name: On-prem Distribution Retention
on:
  workflow_run:
    workflows: [On-prem Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only versions, retired packages and releases in the freshly revalidated plan
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: onprem-distribution-retention
  cancel-in-progress: false
jobs:
  cleanup:
    if: >-
      github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == 'videoq-jp/videoq'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify retention safety
        run: python3 -m unittest discover -s .github/scripts -p test_onprem_distribution.py -v
      - name: Plan from live releases, open PR pins and complete OCI graphs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/onprem_distribution.py plan --file "$RUNNER_TEMP/retention-plan.json"
      - name: Revalidate all references before applying the saved plan
        if: github.event_name == 'workflow_run' || inputs.apply == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/onprem_distribution.py apply --file "$RUNNER_TEMP/retention-plan.json"
      - name: Retain the deletion plan and exact operation journal
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-retention-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retention-*.json
          if-no-files-found: warn
          retention-days: 90
