# Internal CI component; never starts a separate PR workflow.
name: Container Checks
on:
  workflow_call:
    inputs:
      containers:
        type: boolean
        required: true
      worker:
        type: boolean
        required: true
permissions:
  contents: read
jobs:
  container-validate:
    if: inputs.containers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - name: Check Dockerfile instructions and base images
        run: |
          docker build --check -f apps/api/Dockerfile.local .
          docker build --check -f apps/api/Dockerfile .
          docker build --check -f apps/web/Dockerfile .
          docker build --check -f apps/web/Dockerfile.dev .
          docker build --check --platform linux/arm64 -f apps/worker/Dockerfile apps/worker
          docker build --check -f apps/worker/Dockerfile.local apps/worker
          docker build --check -f apps/worker/Dockerfile.onprem apps/worker



  container-node-runtime:
    name: Node container (${{ matrix.name }})
    if: inputs.containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile.local
            target: ''
          - name: web
            dockerfile: apps/web/Dockerfile
            target: build
          - name: web-dev
            dockerfile: apps/web/Dockerfile.dev
            target: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the actual application image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
        run: |
          args=()
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          docker build --pull "${args[@]}" -t videoq-node-runtime -f "$DOCKERFILE" .
      - name: Require the reviewed Node and npm versions inside the image
        run: |
          test "$(docker run --rm --entrypoint node videoq-node-runtime -p process.versions.node)" = "$(cat .node-version)"
          expected=$(python3 -c 'import json; print(json.load(open(".github/runtime-versions.json"))["npm"])')
          test "$(docker run --rm --entrypoint npm videoq-node-runtime --version)" = "$expected"
      - name: Test application types and native Worker runtime
        if: matrix.name == 'api'
        run: |
          docker run --rm --entrypoint npm videoq-node-runtime run typecheck
          docker run --rm --entrypoint npm videoq-node-runtime run test:workers



  container-worker-image:
    name: Worker image security (ARM64)
    if: inputs.worker
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No AWS credentials or production secrets are available while building
      # and scanning PR code. The Dockerfile also validates runtime imports.
      - name: Build the production target
        run: docker build --platform linux/arm64 --target production -t videoq-worker:ci apps/worker
      - name: Require no HIGH or CRITICAL vulnerabilities in the production filesystem
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-worker:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 15m
