name: On-prem Validation
on:
  workflow_call:
    inputs:
      gpu_accelerator:
        type: string
        default: both
      gpu_candidates_only:
        type: boolean
        default: false
      nvidia_candidate:
        type: string
        default: ''
      amd_candidate:
        type: string
        default: ''
      validate_whisper_gpu:
        type: boolean
        default: false
      validate_real_cpu:
        type: boolean
        default: false
      # Pinned third-party images change only when their digests do, but new
      # advisories can fail them at any time. CI scans them when the pins
      # change; the daily Operations run always does.
      scan_upstream_images:
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  onprem:
    if: ${{ !inputs.gpu_candidates_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      ONPREM_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reserve disk for real CPU models and duplicate kind image caches
        if: inputs.validate_real_cpu
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api
      - name: Validate the lab HTTP transport and cancellation
        run: node --test .github/onprem-lab/http.test.cjs
      - name: Install pinned Helm
        run: HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
      - name: Validate runtime, shared state and chart variants
        run: |
          npm run typecheck --workspace @videoq/api
          npm run build:node --workspace @videoq/api
          npm run db:migrate --workspace @videoq/api
          HELM_BIN="$RUNNER_TEMP/helm/helm" npm run test:unit --workspace @videoq/api -- test/node-runtime.test.ts test/node-runtime.integration.test.ts test/onprem-edition.integration.test.ts test/node-storage.test.ts test/helm-chart.test.ts test/inference-chart.test.ts test/local-chat-model.test.ts
          "$RUNNER_TEMP/helm/helm" lint charts/videoq --strict -f charts/videoq/examples/site.yaml
          "$RUNNER_TEMP/helm/helm" lint charts/videoq-inference --strict
          "$RUNNER_TEMP/helm/helm" lint charts/videoq-inference --strict -f charts/videoq-inference/examples/whisper-nvidia.yaml
          "$RUNNER_TEMP/helm/helm" lint charts/videoq-inference --strict -f charts/videoq-inference/examples/llamacpp-cpu.yaml
          "$RUNNER_TEMP/helm/helm" lint charts/videoq-inference --strict -f charts/videoq-inference/examples/vllm-nvidia.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: apps/inference/whisper/.python-version
      - name: Install checksum-pinned uv
        run: bash .github/scripts/install-uv.sh
      - name: Validate the private Whisper API with locked dependencies
        working-directory: apps/inference/whisper
        run: |
          uv sync --locked
          uv run --locked pytest -q
          docker build -t videoq-local-whisper:onprem-ci .
          docker run --rm --entrypoint python videoq-local-whisper:onprem-ci -c 'import server; import provision; import silero_vad; import torch; assert server.MODEL_ALIAS == "whisper-local"'
          LOCAL_WHISPER_CONTAINER_IMAGE=videoq-local-whisper:onprem-ci uv run --locked pytest -q tests/test_real_container.py
      - name: Build production on-prem images
        id: images
        run: |
          docker build -t videoq-api:onprem-ci -f apps/api/Dockerfile .
          docker build -t videoq-worker:onprem-ci -f apps/worker/Dockerfile.onprem apps/worker
          docker build -t videoq-web:onprem-ci -f apps/web/Dockerfile .
      - name: Exercise production API image over HTTP
        working-directory: apps/api
        run: node scripts/smoke-node.mjs videoq-api:onprem-ci
      - name: Exercise migration command and worker imports in production images
        run: |
          docker run --rm --network host --env DATABASE_URL videoq-api:onprem-ci sh scripts/db-migrate.sh
          docker run --rm --entrypoint python videoq-worker:onprem-ci -c 'import os; assert os.environ["DEPLOYMENT_EDITION"] == "onprem"; import worker_python.lambda_handler; import runpy; runpy.run_path("scripts/run_worker.py", run_name="import_check")'
      - name: Scan the API image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-api:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan the worker image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-worker:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan the web image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-web:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan the local Whisper image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: videoq-local-whisper:onprem-ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Resolve the pinned llama.cpp image
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const image = parse(readFileSync('charts/videoq-inference/values.yaml', 'utf8')).llamacpp.image;
          const reference = `${image.repository}@${image.digest}`;
          if (!/^[a-z0-9./_-]+@sha256:[a-f0-9]{64}$/.test(reference)) throw new Error('An exact llama.cpp image digest is required');
          appendFileSync(process.env.GITHUB_ENV, `LLAMACPP_IMAGE=${reference}\n`);
          JS
      - name: Scan the llama.cpp CPU image including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.images.outcome == 'success' && inputs.scan_upstream_images }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.LLAMACPP_IMAGE }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Record package inventories for incident response
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        run: |
          mkdir -p sbom
          for component in api worker web local-whisper; do
            trivy image --image-src docker --format cyclonedx --output "sbom/${component}.cdx.json" "videoq-${component}:onprem-ci"
          done
          trivy image --format cyclonedx --output sbom/llamacpp.cdx.json "$LLAMACPP_IMAGE"
      - name: Retain the image inventories
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-sbom-${{ github.sha }}
          path: sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Install checksum-pinned kind
        run: KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Exercise Kubernetes install, processing, restore, upgrade and rollback
        env:
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          kind create cluster --name videoq-onprem-lab --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/lab-kubeconfig" --wait 180s
          python3 .github/scripts/onprem-lab.py "$RUNNER_TEMP/lab-kubeconfig" "$RUNNER_TEMP/lab-result"
      - name: Retain Kubernetes validation evidence
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-lab-${{ github.sha }}
          path: ${{ runner.temp }}/lab-result/result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove the disposable Kubernetes cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name videoq-onprem-lab --kubeconfig "$RUNNER_TEMP/lab-kubeconfig"
          fi
      - name: Install the real CPU acceptance browser
        if: inputs.validate_real_cpu
        run: |
          npm ci --ignore-scripts --workspace @videoq/api --workspace @videoq/web
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Exercise source builds with real CPU models and blocked public egress
        if: inputs.validate_real_cpu
        env:
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          df -h "$RUNNER_TEMP"
          python3 - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('acceptance', '.github/scripts/onprem-cpu-acceptance.py')
          acceptance = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(acceptance)
          output = Path(os.environ['RUNNER_TEMP']) / 'cpu-preflight'
          images = {c:'videoq-'+c+':onprem-ci' for c in ['api','worker','web']}
          images['whisper'] = 'videoq-local-whisper:onprem-ci'
          result = acceptance.rehearse(os.environ['GITHUB_SHA'], Path('charts/videoq'), Path('charts/videoq-inference'), output, images, local_builds=True)
          result['verification'] = 'PR source build test; not signed-release verification'
          acceptance.release.write_atomic(output/'result.json', result)
          PY
      - name: Retain real CPU source-build evidence
        if: ${{ !cancelled() && inputs.validate_real_cpu }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-cpu-preflight-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cpu-preflight/result.json
            ${{ runner.temp }}/cpu-preflight/real-ai-result.json
            ${{ runner.temp }}/cpu-preflight/playback.json
            ${{ runner.temp }}/cpu-preflight/diagnostics.json
          if-no-files-found: error
          retention-days: 30

  vllm-image:
    name: vLLM ${{ matrix.accelerator }} upstream image
    strategy:
      fail-fast: false
      matrix:
        accelerator: ${{ github.event_name == 'workflow_dispatch' && inputs.gpu_accelerator == 'nvidia' && fromJSON('["nvidia"]') || github.event_name == 'workflow_dispatch' && inputs.gpu_accelerator == 'amd' && fromJSON('["amd"]') || fromJSON('["nvidia","amd"]') }}
    if: inputs.validate_whisper_gpu
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api
      - name: Reserve disk for the upstream GPU image on the disposable runner
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Resolve the pinned upstream vLLM image
        id: gpu_image
        env:
          ACCELERATOR: ${{ matrix.accelerator }}
          NVIDIA_CANDIDATE: ${{ inputs.nvidia_candidate }}
          AMD_CANDIDATE: ${{ inputs.amd_candidate }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const vllm = parse(readFileSync('charts/videoq-inference/values.yaml', 'utf8')).vllm;
          const image = process.env.ACCELERATOR === 'amd' ? vllm.rocmImage : vllm.image;
          const repository = process.env.ACCELERATOR === 'amd' ? 'vllm/vllm-openai-rocm' : 'vllm/vllm-openai';
          const candidate = process.env.ACCELERATOR === 'amd' ? process.env.AMD_CANDIDATE : process.env.NVIDIA_CANDIDATE;
          const reference = candidate || `${image.repository}@${image.digest}`;
          const repositories = process.env.ACCELERATOR === 'amd' ? [repository] : [repository, 'nvcr.io/nvidia/vllm'];
          if (!repositories.some(repo => reference.startsWith(repo + '@')) || !/^[a-z0-9./_-]+@sha256:[a-f0-9]{64}$/.test(reference)) throw new Error('An exact official upstream vLLM image digest is required');
          appendFileSync(process.env.GITHUB_ENV, `ASSESS_NVIDIA_HEADERS=${reference.startsWith('vllm/vllm-openai@')}\n`);
          appendFileSync(process.env.GITHUB_ENV, `VLLM_IMAGE=${reference}\n`);
          JS
      - name: Pull the upstream image without rebuilding
        run: docker pull "$VLLM_IMAGE"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: matrix.accelerator == 'amd'
        with:
          python-version-file: apps/inference/whisper/.python-version
      - name: Install checksum-pinned uv for the offline ROCm codec payload
        if: matrix.accelerator == 'amd'
        run: bash .github/scripts/install-uv.sh
      - name: Export locked codec packages without CPU inference libraries
        if: matrix.accelerator == 'amd'
        working-directory: apps/inference/whisper
        run: |
          uv sync --locked --no-dev --no-install-package torch --no-install-package onnxruntime
          .venv/bin/python provision_audio.py "$RUNNER_TEMP/rocm-audio"
      - name: Check the gateway WAV decoding path without a GPU or network
        env:
          ACCELERATOR: ${{ matrix.accelerator }}
        run: |
          set -o pipefail
          audio=()
          if [ "$ACCELERATOR" = amd ]; then
            audio=(--env PYTHONPATH=/audio-deps --volume "$RUNNER_TEMP/rocm-audio:/audio-deps:ro")
          fi
          docker run --rm --network none --user 10001:10001 --env HOME=/tmp --env HF_HUB_OFFLINE=1 "${audio[@]}" --volume "$PWD/apps/inference/vllm:/checks:ro" --entrypoint python3 "$VLLM_IMAGE" /checks/check_runtime.py | tee vllm-runtime.json
      - name: Verify the upstream kernel-header inventory for the NVIDIA-only assessment
        if: matrix.accelerator == 'nvidia' && env.ASSESS_NVIDIA_HEADERS == 'true'
        run: docker run --rm --network none --volume "$PWD/apps/inference/vllm/security:/checks:ro" --entrypoint python3 "$VLLM_IMAGE" /checks/verify_kernel_headers.py
      - name: Scan upstream vLLM including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.gpu_image.outcome == 'success' }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.VLLM_IMAGE }}
          trivy-config: ${{ matrix.accelerator == 'nvidia' && env.ASSESS_NVIDIA_HEADERS == 'true' && 'apps/inference/vllm/security/trivy.yaml' || '' }}
          format: json
          output: vllm-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 15m
      - name: Bind scan evidence to the exact requested image
        if: ${{ !cancelled() && steps.gpu_image.outcome == 'success' }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          reference = os.environ['VLLM_IMAGE']
          report = json.loads(Path('vllm-security.json').read_text())
          if reference not in report.get('Metadata', {}).get('RepoDigests', []):
              raise RuntimeError('The scan report does not identify the requested vLLM digest')
          Path('vllm-image.json').write_text(json.dumps({'reference': reference, 'platform': 'linux/amd64'}) + '\n')
          PY
      - name: Retain scan findings and the NVIDIA-only header assessment
        if: ${{ !cancelled() && steps.gpu_image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.1
        with:
          name: vllm-security-${{ matrix.accelerator }}
          path: |
            vllm-security.json
            vllm-runtime.json
            vllm-image.json
            apps/inference/vllm/security/
          retention-days: 14
          if-no-files-found: error

  upstream-cpu-images:
    name: ${{ matrix.engine }} Linux ${{ matrix.architecture }} upstream image
    if: ${{ !inputs.gpu_candidates_only && inputs.scan_upstream_images }}
    strategy:
      fail-fast: false
      matrix:
        engine: [llamacpp, whispercpp]
        architecture: [amd64, arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api
      - name: Resolve the upstream image for the selected architecture
        id: cpu_image
        env:
          ENGINE: ${{ matrix.engine }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { parse } from 'yaml';
          const values = parse(readFileSync('charts/videoq-inference/values.yaml', 'utf8'));
          const image = process.env.ENGINE === 'llamacpp'
            ? values.llamacpp.image : values.whispercpp.images[process.env.ARCHITECTURE];
          const reference = `${image.repository}@${image.digest}`;
          if (!/^[a-z0-9./_-]+@sha256:[a-f0-9]{64}$/.test(reference)) throw new Error('An exact upstream CPU image digest is required');
          appendFileSync(process.env.GITHUB_ENV, `UPSTREAM_CPU_IMAGE=${reference}\n`);
          JS
      - name: Verify the exact whisper.cpp header-only image inventory
        id: header_inventory
        if: matrix.engine == 'whispercpp'
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          docker pull --platform "linux/$ARCHITECTURE" "$UPSTREAM_CPU_IMAGE"
          python3 .github/scripts/check-upstream-header-image.py "$UPSTREAM_CPU_IMAGE" "$ARCHITECTURE" \
            --approved apps/inference/whispercpp/security/header-image-inventory.json > header-inventory.json
      # Select the manifest explicitly; scanning ARM packages requires no emulation.
      # Use the registry so a cached amd64 Docker image cannot shadow arm64.
      - name: Scan upstream CPU images including unfixed vulnerabilities
        if: ${{ !cancelled() && steps.cpu_image.outcome == 'success' && (matrix.engine != 'whispercpp' || steps.header_inventory.outcome == 'success') }}
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # v0.35.0
        env:
          TRIVY_PLATFORM: linux/${{ matrix.architecture }}
          TRIVY_IMAGE_SRC: remote
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.UPSTREAM_CPU_IMAGE }}
          trivy-config: ${{ matrix.engine == 'whispercpp' && 'apps/inference/whispercpp/security/trivy.yaml' || '' }}
          format: json
          output: upstream-cpu-security.json
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 15m
      - name: Verify the report covers the requested platform and digest
        if: ${{ !cancelled() && steps.cpu_image.outcome == 'success' }}
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('upstream-cpu-security.json', 'utf8'));
          if (report.Metadata?.ImageConfig?.architecture !== process.env.ARCHITECTURE) {
            throw new Error('Scan report architecture differs from the requested platform');
          }
          if (!report.Metadata?.RepoDigests?.includes(process.env.UPSTREAM_CPU_IMAGE)) {
            throw new Error('Scan report does not identify the requested upstream digest');
          }
          JS
      - name: Retain architecture-specific findings
        if: ${{ !cancelled() && steps.cpu_image.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-cpu-security-${{ matrix.engine }}-${{ matrix.architecture }}
          path: |
            upstream-cpu-security.json
            header-inventory.json
            apps/inference/whispercpp/security/
          retention-days: 30
          if-no-files-found: error
