name: Cloudflare Infrastructure
on:
  workflow_call:
    inputs:
      apply:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the reviewed Cloudflare foundation and state-storage plan
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: cloudflare-foundation
  cancel-in-progress: false
jobs:
  infrastructure:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-infra
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_TERRAFORM_API_TOKEN }}
      TF_VAR_email_addresses: ${{ secrets.CLOUDFLARE_TERRAFORM_EMAIL_ADDRESSES }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await require('./.github/scripts/validate-deployment.cjs')({github, context});
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.1
          terraform_wrapper: false
      - uses: ./.github/actions/terraform-r2
        with:
          access-key-id: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          secret-access-key: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      - name: Plan privately; publish only resource actions
        env:
          APPLY: ${{ inputs.apply }}
        run: node .github/scripts/terraform-cloudflare-foundation.cjs
