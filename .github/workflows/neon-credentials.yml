name: Maintain Neon Credentials
run-name: Neon credentials ${{ inputs.operation || 'scheduled rotation' }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit ages, rotate due credentials, or recover an unfinished rotation
        type: choice
        options: [audit, rotate, rollback]
        default: audit
      force:
        description: Rotate even when credentials are younger than 90 days
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-db-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-db-maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: read
      id-token: write
    env:
      AWS_DB_REQUEST_ROLE_ARN: ${{ secrets.AWS_GITHUB_ACTIONS_DB_REQUEST_ROLE_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/aws-db-invocation
      - name: Request and observe the fixed AWS operation
        env:
          OPERATION: ${{ inputs.operation }}
          FORCE_ROTATION: ${{ inputs.force && 'true' || 'false' }}
        run: python3 .github/scripts/run-aws-db.py "$OPERATION"
