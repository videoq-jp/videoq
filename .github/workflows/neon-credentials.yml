name: Maintain Neon Credentials
run-name: Neon credentials ${{ inputs.operation || 'scheduled rotation' }}
on:
  schedule:
    - cron: '31 18 * * *' # 03:31 JST; rotate only when credentials are due.
  workflow_dispatch:
    inputs:
      operation:
        description: Audit ages, rotate due credentials, or recover an unfinished rotation
        type: choice
        options: [audit, rotate, rollback]
        default: audit
      force:
        description: Rotate even when credentials are younger than 90 days
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: production-db-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    environment: production-infra
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-operations-tools
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_NEON_ROTATION_ROLE_ARN }}
          role-session-name: videoq-neon-maintenance-${{ github.run_id }}
          aws-region: ap-northeast-1
          role-duration-seconds: 7200
      - name: Audit database credential ages
        if: inputs.operation == 'audit'
        run: node .github/scripts/neon-admin.cjs audit
      - name: Rotate or recover production database credentials
        if: github.event_name == 'schedule' || inputs.operation != 'audit'
        env:
          OPERATION: ${{ inputs.operation || 'rotate' }}
          FORCE_ROTATION: ${{ inputs.force && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INFRA_TOKEN }}
        run: node .github/scripts/neon-rotate.cjs
