name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Review newly introduced vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          fail-on-scopes: runtime,development,unknown
          license-check: false
          comment-summary-in-pr: never
          retry-on-snapshot-warnings: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: pip
      - name: Check lockfile sources, integrity and vulnerability delta
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: python .github/scripts/supply-chain.py --base "$BASE_SHA"
      # Verify registry signatures before any package code executes in this job.
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm ci --ignore-scripts --prefix .github/deploy-tools
      - run: npm audit signatures --prefix .github/deploy-tools

  workflow-security:
    name: Deployment Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Test production deployment policy
        run: node --test .github/scripts/*.test.cjs
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Require consistent interpreter and package manager pins
        run: python3 .github/scripts/runtime-versions.py check

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, supply-chain, workflow-security, container-result, terraform-result, operations-fixture, onprem-validation, local-inference-basic, hono-test, worker-test, frontend-lint, frontend-test, frontend-coverage, frontend-build, frontend-storybook, docs-build]
    steps:
      - name: Require every selected CI job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const failed = Object.entries(jobs).filter(([name, job]) =>
            (['changes', 'supply-chain', 'workflow-security', 'container-result', 'terraform-result'].includes(name) ||
              (name === 'operations-fixture' && jobs.changes.outputs.operations === 'true') ||
              (['onprem-validation', 'local-inference-basic'].includes(name) && jobs.changes.outputs.onprem === 'true'))
              ? job.result !== 'success'
              : !['success', 'skipped'].includes(job.result)
          );
          if (failed.length) {
            console.error('Required CI jobs did not pass:', failed.map(([name]) => name).join(', '));
            process.exit(1);
          }
          NODE

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.filter.outputs.containers }}
      container_worker: ${{ steps.filter.outputs.container_worker }}
      terraform: ${{ steps.filter.outputs.terraform }}
      operations: ${{ steps.filter.outputs.operations }}
      hono: ${{ steps.filter.outputs.hono }}
      worker: ${{ steps.filter.outputs.worker }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      docs: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.docs == 'true' }}
      worker_matrix: ${{ steps.runtimes.outputs.matrix }}
      onprem: ${{ steps.filter.outputs.onprem }}
      whisper_gpu: ${{ steps.filter.outputs.whisper_gpu }}
      upstream_images: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.upstream_images == 'true' }}
      real_cpu: ${{ steps.filter.outputs.real_cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: |
            containers:
              - '.github/workflows/container-validation.yml'
              - 'apps/api/Dockerfile*'
              - 'apps/web/Dockerfile*'
              - 'apps/worker/Dockerfile*'
              - 'docker-compose.yml'
              - '.github/workflows/ci.yml'
              - '.github/runtime-versions.json'
              - '.node-version'
              - '.python-version'
              - '.github/actions/**'
              - '.github/scripts/runtime-*'
              - '.github/scripts/package-managers.py'
            container_worker:
              - '.github/workflows/container-validation.yml'
              - 'apps/worker/**'
              - '.github/runtime-versions.json'
              - '.python-version'
              - '.github/scripts/runtime-*'
              - '.github/scripts/package-managers.py'
              - '.github/workflows/ci.yml'
            terraform:
              - '.github/workflows/terraform-plan.yml'
              - 'infra/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/terraform-apply.yml'
            operations:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-package-manager/**'
              - '.github/operations-tools/**'
              - '.github/scripts/backup-restore*'
              - '.github/scripts/production-*'
              - '.github/actions/setup-operations-tools/**'
              - '.github/workflows/operations.yml'
            whisper_gpu:
              - 'apps/inference/whisper/Dockerfile.vllm'
              - '.github/workflows/onprem-validation.yml'
            upstream_images:
              - 'charts/videoq-inference/values.yaml'
              - 'apps/inference/whispercpp/security/**'
              - '.github/scripts/check-upstream-header-image.py'
              - '.github/workflows/onprem-validation.yml'
            real_cpu:
              - '.github/workflows/onprem-validation.yml'
              - '.github/scripts/onprem-cpu-acceptance.py'
              - '.github/scripts/onprem-lab.py'
              - '.github/onprem-lab/**'
              - 'charts/videoq-inference/**'
            onprem:
              - '.github/inference-basic-packages.json'
              - '.dockerignore'
              - 'charts/**'
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'apps/inference/**'
              - 'apps/web/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/onprem-validation.yml'
              - '.github/workflows/local-inference-basic.yml'
              - '.github/scripts/install-helm.sh'
              - '.github/scripts/install-kind.sh'
              - '.github/scripts/onprem-*'
              - '.github/onprem-lab/**'
              - '.github/workflows/onprem-release.yml'
              - '.github/runtime-versions.json'
              - '.node-version'
              - '.python-version'
              - '.github/actions/**'
              - '.github/scripts/runtime-versions.py'
              - '.github/scripts/package-managers.py'
            hono:
              - 'apps/api/**'
              - 'apps/worker/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - '.github/scripts/deployment-config*'
              - '.github/scripts/verify-prebuilt-deployment.sh'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            worker:
              - 'apps/worker/**'
              - 'packages/trpc/test-fixtures/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - '.github/scripts/deployment-config*'
              - '.github/scripts/verify-prebuilt-deployment.sh'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            frontend:
              - 'apps/web/**'
              - 'apps/demo-video/**'
              - 'packages/trpc/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - '.github/scripts/deployment-config*'
              - '.github/scripts/verify-prebuilt-deployment.sh'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
              - '.github/scripts/deployment-config*'
              - '.github/scripts/verify-prebuilt-deployment.sh'
              - '.github/deploy-tools/**'
              - ".github/runtime-versions.json"
              - ".node-version"
              - ".python-version"
              - ".github/actions/**"
              - ".github/scripts/runtime-versions.py"
              - ".github/scripts/package-managers.py"

      - name: Read the supported and production Python versions
        id: runtimes
        run: python3 .github/scripts/runtime-versions.py matrix >> "$GITHUB_OUTPUT"

  onprem-validation:
    name: On-prem Validation
    needs: changes
    if: needs.changes.outputs.onprem == 'true'
    uses: ./.github/workflows/onprem-validation.yml
    with:
      validate_whisper_gpu: ${{ needs.changes.outputs.whisper_gpu == 'true' }}
      validate_real_cpu: ${{ github.event_name == 'pull_request' && needs.changes.outputs.real_cpu == 'true' }}
      scan_upstream_images: ${{ needs.changes.outputs.upstream_images == 'true' }}
    permissions:
      contents: read

  local-inference-basic:
    name: Local Inference Basic Checks
    needs: changes
    if: needs.changes.outputs.onprem == 'true'
    uses: ./.github/workflows/local-inference-basic.yml
    permissions:
      contents: read

  hono-test:
    name: Hono (apps/api)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.hono == 'true'
    env:
      QUOTA_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      EMBEDDING_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: pip
      - name: Install checksum-pinned uv
        run: bash .github/scripts/install-uv.sh
      - name: Install worker for cross-language embedding tests
        run: |
          uv export --quiet --project apps/worker --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/worker-requirements.txt"
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/worker-requirements.txt"
      - name: Install / typecheck / test
        run: |
          npm ci --ignore-scripts
          npm run cf-typegen:check --workspace @videoq/api
          npm run typecheck --workspace @videoq/trpc
          npm run typecheck --workspace @videoq/api
          npm run db:check --workspace @videoq/api
          npm run db:verify --workspace @videoq/api
          npm test --workspace @videoq/api
          bash .github/scripts/verify-prebuilt-deployment.sh api

  worker-test:
    name: Worker Python
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.worker_matrix) }}
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: pip
      # Cost-model tests read the TypeScript plan catalog with native type stripping.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install shared contracts for cost-model tests
        run: npm ci --ignore-scripts --workspace @videoq/trpc
      - name: Install checksum-pinned uv
        run: bash .github/scripts/install-uv.sh
      - name: Install and test
        working-directory: apps/worker
        run: |
          # The runner's preferred Azure HTTP mirror can stall each download.
          # Use the signed Ubuntu archive already present in its fallback list.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          uv export --quiet --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/worker-requirements.txt"
          python -m pip install --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/worker-requirements.txt"
          python -m pytest tests/ -q

      - name: Verify the production ARM64 media image
        if: matrix.production
        run: |
          docker build --platform linux/arm64 -t videoq-worker-test apps/worker
          uv export --quiet --project apps/worker --locked --extra dev --no-emit-project --format requirements-txt --output-file apps/worker/ci-requirements.txt
          # Production has no package installer. Mount the checksum-verified CI
          # uv binary only for installing the locked test dependencies here.
          docker run --rm --entrypoint /bin/sh \
            -v "$(command -v uv):/ci-uv:ro" \
            -v "$PWD:/workspace:ro" -w /workspace/apps/worker videoq-worker-test \
            -c '/ci-uv pip install --system --python /var/lang/bin/python --require-hashes --only-binary=:all: -r ci-requirements.txt && python -m pytest -p no:cacheprovider tests/test_media_process.py tests/test_remote_media.py tests/test_visual_frames.py tests/test_focus_frames.py tests/test_visual_chunks.py -q'

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint --workspace @videoq/web
      - name: Type check
        run: npm run typecheck --workspace @videoq/web

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests with coverage
        run: npm run test:coverage --workspace @videoq/web
      - name: Save frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: apps/web/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 7

  frontend-coverage:
    name: Frontend Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: frontend-test
    # Keep OIDC credentials out of the job that installs and executes PR code.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download frontend coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/coverage-final.json
          disable_search: true
          plugins: noop
          flags: frontend
          use_oidc: true
          fail_ci_if_error: true

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build --workspace @videoq/web
      - name: Check demo composition types
        run: npm run typecheck --workspace @videoq/demo-video
      - name: Verify published demo videos
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 apps/demo-video/scripts/verify-video.py apps/web/public/demo/student-demo-ja.mp4 apps/demo-video/content/timeline.json
          python3 apps/demo-video/scripts/verify-video.py apps/web/public/demo/student-demo-en.mp4 apps/demo-video/content/timeline.json
      - name: Check Worker binding types
        run: |
          npm run cf-typegen --workspace @videoq/web
          git diff --exit-code -- apps/web/worker/env.d.ts
      - name: Test frontend Worker and static assets
        env:
          VERIFY_PRERENDER_HYDRATION: "true"
        run: npm run test:worker --workspace @videoq/web
      - name: Verify upload-only web deployment
        run: bash .github/scripts/verify-prebuilt-deployment.sh web
      - name: Upload build artifacts
        # CD produces its own immutable application artifact. Retain a duplicate
        # CI build only when an operator explicitly dispatches this workflow.
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: apps/web/dist
          retention-days: 7

  frontend-storybook:
    name: Frontend Storybook
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build Storybook
        run: npm run build:storybook
      - name: Install Chromium
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          npm exec --workspace @videoq/web -- playwright install --with-deps chromium
      - name: Test stories in Chromium
        run: npm run test:storybook
      - name: Upload Storybook
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-storybook
          path: apps/web/storybook-static
          retention-days: 7

  docs-build:
    name: Documentation Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --workspace @videoq/docs
      - name: Type check
        run: npm run typecheck --workspace @videoq/docs
      - name: Build documentation and check links
        run: npm run build:docs
      - name: Verify upload-only documentation deployment
        run: bash .github/scripts/verify-prebuilt-deployment.sh docs
      - name: Upload documentation
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-build
          path: apps/docs/build
          retention-days: 7

  container-checks:
    needs: changes
    if: needs.changes.outputs.containers == 'true' || needs.changes.outputs.container_worker == 'true'
    uses: ./.github/workflows/container-validation.yml
    with:
      containers: ${{ needs.changes.outputs.containers == 'true' }}
      worker: ${{ needs.changes.outputs.container_worker == 'true' }}
    permissions:
      contents: read

  container-result:
    name: Container Validation
    needs: [changes, container-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.containers == 'true' || needs.changes.outputs.container_worker == 'true' }}
          RESULT: ${{ needs.container-checks.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; fi
  terraform-checks:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    uses: ./.github/workflows/terraform-plan.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    secrets: inherit

  terraform-result:
    name: Terraform Plan
    needs: [changes, terraform-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.terraform }}
          RESULT: ${{ needs.terraform-checks.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$SELECTED" = true ]; then test "$RESULT" = success; fi
  operations-fixture:
    needs: changes
    if: needs.changes.outputs.operations == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-operations-tools
      - run: node --test .github/scripts/production-stream-proof.integration.cjs
      - name: Verify the hosted Chrome channel without production access
        run: |
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          const require = createRequire(process.cwd() + '/.github/operations-tools/package.json');
          const { chromium } = require('playwright');
          const browser = await chromium.launch({ channel: 'chrome' });
          await browser.close();
          JS
      - name: Restore synthetic vector data and foreign keys without production access
        run: node .github/scripts/backup-restore-fixture.mjs
