# PR validation never receives AWS credentials or production state.
name: Terraform Checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Dependabot and fork PRs must validate without production state or secrets.
      - name: Terraform init (without backend)
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Terraform validate
        run: terraform validate -no-color

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Test Terraform approval and no-change behavior
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Terraform tests (mock providers)
        run: terraform test -no-color

      - name: Validate state backend bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
