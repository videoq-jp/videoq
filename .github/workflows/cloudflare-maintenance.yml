name: Deploy Cloudflare Maintenance
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-maintenance-deployment
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await require('./.github/scripts/validate-deployment.cjs')({github, context});
      - uses: ./.github/actions/cloudflare-maintenance-tools
        with:
          purpose: migration
      - name: Verify native ownership and build without production credentials
        run: |
          node .github/scripts/cloudflare-maintenance.native.mjs
          node .github/scripts/maintenance-build.cjs "$GITHUB_WORKSPACE/maintenance-artifact"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-${{ github.sha }}
          path: maintenance-artifact/
          if-no-files-found: error
          retention-days: 1
  deploy:
    needs: build
    environment: production-infra
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: await require('./.github/scripts/validate-deployment.cjs')({github, context});
      - uses: ./.github/actions/cloudflare-maintenance-tools
        with:
          purpose: migration
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: maintenance-${{ github.sha }}
          path: maintenance-artifact
      - name: Generate fixed upload-only configuration
        env:
          CLOUDFLARE_MAINTENANCE_ENABLED: ${{ vars.CLOUDFLARE_MAINTENANCE_ENABLED || 'false' }}
        run: node .github/scripts/maintenance-deployment.cjs maintenance-artifact maintenance-deployment.json
      - name: Upload prebuilt coordinator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node .github/deploy-tools/node_modules/wrangler/bin/wrangler.js deploy --config maintenance-deployment.json --no-bundle --no-autoconfig --env-file /dev/null
