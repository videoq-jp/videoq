name: On-prem Release
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onprem-release
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const validate = require('./.github/scripts/validate-deployment.cjs');
            core.setOutput('sha', await validate({ github, context }));
  build:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web, transcription-gateway, vllm-engine]
        exclude:
          - component: vllm-engine
            arch: arm64
        include:
          - component: api
            dockerfile: apps/api/Dockerfile
            context: .
          - component: worker
            dockerfile: apps/worker/Dockerfile.onprem
            context: apps/worker
          - component: web
            dockerfile: apps/web/Dockerfile
            context: .
          - component: transcription-gateway
            dockerfile: apps/inference/whisper/Dockerfile
            context: apps/inference/whisper
          - component: vllm-engine
            dockerfile: apps/inference/whisper/Dockerfile.vllm
            context: apps/inference/whisper
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-onprem-image
        with:
          image: videoq-${{ matrix.component }}:release
          dockerfile: ${{ matrix.dockerfile }}
          context: ${{ matrix.context }}
          platform: linux/${{ matrix.arch }}
          cuda: ${{ matrix.component == 'vllm-engine' }}
          security-config: ${{ matrix.component == 'vllm-engine' && 'apps/inference/whisper/security/trivy.yaml' || matrix.component == 'transcription-gateway' && 'apps/inference/whisper/security/cpu-trivy.yaml' || '' }}
          evidence-name: security-${{ matrix.component }}-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          artifact-name: build-${{ matrix.component }}-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
  chart:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
      - run: |
          mkdir -p release
          "$RUNNER_TEMP/helm/helm" package charts/videoq --version "0.1.0-sha.$GITHUB_SHA" --app-version "$GITHUB_SHA" --destination release
          "$RUNNER_TEMP/helm/helm" package charts/videoq-inference --version "0.1.0-sha.$GITHUB_SHA" --app-version "$GITHUB_SHA" --destination release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chart-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [source, build]
    strategy:
      fail-fast: false
      matrix:
        component: [api, worker, web, transcription-gateway, vllm-engine]
        arch: [amd64, arm64]
        exclude:
          - component: vllm-engine
            arch: arm64
    runs-on: ubuntu-24.04
    # The compressed CUDA OCI graph is ~8 GB; artifact transfer and push can exceed 25 minutes.
    timeout-minutes: ${{ matrix.component == 'vllm-engine' && 45 || 25 }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # Fresh runner: never build or execute the application's code here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-${{ matrix.component }}-${{ matrix.arch }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
          token: ''
      - name: Publish the scanned OCI image without executing it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
        run: |
          digest=$(python3 -c 'import json,re; x=json.load(open("image/index.json"))["manifests"]; assert len(x)==1; d=x[0]["digest"]; assert re.fullmatch("sha256:[a-f0-9]{64}",d); print(d)')
          python3 .github/scripts/onprem_registry.py "$COMPONENT"
          repository="ghcr.io/videoq-jp/videoq-$COMPONENT"
          if [ "$COMPONENT" = vllm-engine ]; then
            repository="ghcr.io/videoq-jp/videoq-vllm"
          fi
          tag="$repository:$GITHUB_SHA-$ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir -p "$HOME/.docker"
          printf '%s' "$GH_TOKEN" | oras login --registry-config "$HOME/.docker/config.json" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras cp --from-oci-layout --to-registry-config "$HOME/.docker/config.json" "image@$digest" "$tag"
          test "$(oras resolve --registry-config "$HOME/.docker/config.json" "$tag")" = "$digest"
          python3 .github/scripts/onprem_registry.py "$COMPONENT"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          mkdir -p published
          printf '%s\n' "$digest" > "published/$COMPONENT-$ARCH.digest"
      - name: Sign image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign image package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: published-${{ matrix.component }}-${{ matrix.arch }}-attempt-${{ github.run_attempt }}
          path: published/*.digest
          if-no-files-found: error
          retention-days: 1
  cleanup-build-archives:
    name: Remove consumed image transfer archives
    needs: [source, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        with:
          script: |
            const prune = require('./.github/scripts/prune-onprem-build-artifacts.cjs');
            const result = await prune({ github, context: { repo: context.repo, ref: context.ref, eventName: context.eventName, sha: context.sha, runId: context.runId, runAttempt: process.env.GITHUB_RUN_ATTEMPT }, sourceSha: process.env.SOURCE_SHA });
            core.info(`Removed ${result.deleted} consumed image archives (${result.bytes} bytes).`);
      - name: Clear registry credentials after signing
        if: ${{ always() && (steps.image.outcome == 'success' || steps.image.outcome == 'failure' || steps.image.outcome == 'cancelled') }}
        run: oras logout --registry-config "$HOME/.docker/config.json" ghcr.io
  indexes:
    needs: [source, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        component: [api, worker, web, transcription-gateway, vllm-engine]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: published-${{ matrix.component }}-*-attempt-${{ github.run_attempt }}
          merge-multiple: true
      - id: image
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: |
          python3 .github/scripts/onprem_registry.py "$COMPONENT"
          repository="ghcr.io/videoq-jp/videoq-$COMPONENT"
          if [ "$COMPONENT" = vllm-engine ]; then
            repository="ghcr.io/videoq-jp/videoq-vllm"
          fi
          tag="$repository:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir -p "$HOME/.docker"
          printf '%s' "$GH_TOKEN" | oras login --registry-config "$HOME/.docker/config.json" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          manifests=("$repository@$(cat "$COMPONENT-amd64.digest")")
          if [ "$COMPONENT" != vllm-engine ]; then
            manifests+=("$repository@$(cat "$COMPONENT-arm64.digest")")
          fi
          docker buildx imagetools create --tag "$tag" "${manifests[@]}"
          digest=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')
          mkdir -p release
          printf '%s\n' "$digest" > "release/$COMPONENT.digest"
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: index-${{ matrix.component }}-attempt-${{ github.run_attempt }}
          path: release/*.digest
          if-no-files-found: error
          retention-days: 1
  release:
    needs: [source, indexes, chart]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: index-*-attempt-${{ github.run_attempt }}
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chart-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release
      - run: python3 .github/scripts/onprem-release.py assemble "$GITHUB_SHA" release
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release/release.json
            release/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            release/release.json
            release/*.tgz
          if-no-files-found: error
          retention-days: 90
  staging:
    name: Verify signed artifacts and rehearse the release
    needs: [source, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Reserve disk for anonymous NVIDIA image pulls and Kubernetes rehearsal
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure DNS on this disposable CI runner
        run: python3 .github/scripts/configure-onprem-ci-dns.py --docker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - name: Install the lab HTTP client without application workspaces
        run: npm ci --ignore-scripts --workspaces=false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onprem-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release
      - name: Verify provenance before loading release images
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty registry credentials prove that image pulls are anonymous.
          DOCKER_CONFIG: ${{ runner.temp }}/registry-anonymous
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          printf '{"auths":{}}\n' > "$DOCKER_CONFIG/config.json"
          for component in api worker web transcription-gateway vllm-engine; do
            python3 .github/scripts/onprem_registry.py "$component"
          done
          python3 .github/scripts/onprem-release.py verify "$GITHUB_SHA" release/release.json release/verified-images.json release/verified-inference.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          config = Path(os.environ['DOCKER_CONFIG']) / 'config.json'
          if json.loads(config.read_text()) != {'auths': {}}:
              raise RuntimeError('Release rehearsal must pull without registry credentials')
          images = json.load(open('release/release.json'))['images']
          for component, image in images.items():
              reference = image['repository'] + '@' + image['digest']
              subprocess.run(['docker', 'pull', reference], check=True)
              subprocess.run(['docker', 'tag', reference, 'videoq-' + component + ':onprem-ci'], check=True)
          PY
          rm -rf "$DOCKER_CONFIG"
      - name: Install pinned rehearsal tools
        run: |
          HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
          KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Rehearse the verified release in disposable Kubernetes
        env:
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          kind create cluster --name videoq-onprem-lab --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --kubeconfig "$RUNNER_TEMP/lab-kubeconfig" --wait 180s
          python3 .github/scripts/onprem-lab.py "$RUNNER_TEMP/lab-kubeconfig" "$RUNNER_TEMP/lab-result" --chart "release/videoq-0.1.0-sha.$GITHUB_SHA.tgz"
      - name: Record staging evidence for promotion review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-staging-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            release/verified-images.json
            release/verified-inference.json
            ${{ runner.temp }}/lab-result/result.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove temporary registry configuration and disposable cluster
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/registry-anonymous"
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name videoq-onprem-lab --kubeconfig "$RUNNER_TEMP/lab-kubeconfig"
          fi
  cpu-acceptance:
    name: Real CPU models with public egress blocked
    needs: [source, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Reserve disk for the model cache and disposable Kubernetes node
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure DNS on this disposable CI runner
        run: python3 .github/scripts/configure-onprem-ci-dns.py --docker
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - run: npm ci --ignore-scripts --workspace @videoq/api --workspace @videoq/web
      - name: Install Chromium and OS dependencies with bounded retries
        run: |
          for attempt in 1 2 3; do
            if node node_modules/playwright/cli.js install --with-deps chromium; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep 10
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: onprem-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: release
      - name: Install pinned acceptance tools
        run: |
          HELM_INSTALL_DIR="$RUNNER_TEMP/helm" bash .github/scripts/install-helm.sh
          KIND_INSTALL_DIR="$RUNNER_TEMP" bash .github/scripts/install-kind.sh
      - name: Verify and exercise the real local models
        env:
          GH_TOKEN: ${{ github.token }}
          HELM_BIN: ${{ runner.temp }}/helm/helm
        run: |
          export PATH="$RUNNER_TEMP:$PATH"
          python3 .github/scripts/onprem-cpu-acceptance.py "$GITHUB_SHA" release "$RUNNER_TEMP/cpu-acceptance"
      - name: Retain real-model evidence without credentials or database dumps
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: onprem-cpu-acceptance-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/cpu-acceptance/result.json
            ${{ runner.temp }}/cpu-acceptance/real-ai-result.json
            ${{ runner.temp }}/cpu-acceptance/playback.json
            ${{ runner.temp }}/cpu-acceptance/diagnostics.json
          if-no-files-found: error
          retention-days: 90
      - name: Remove any remaining dedicated acceptance cluster
        if: always()
        run: |
          if [ -x "$RUNNER_TEMP/kind" ]; then
            "$RUNNER_TEMP/kind" delete cluster --name videoq-onprem-lab --kubeconfig "$RUNNER_TEMP/cpu-acceptance/kubeconfig"
          fi
