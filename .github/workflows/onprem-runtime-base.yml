name: On-prem Runtime Base
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onprem-runtime-base
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const validate = require('./.github/scripts/validate-deployment.cjs');
            await validate({ github, context });
  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-onprem-image
        with:
          image: videoq-vllm-runtime-base:scanned
          dockerfile: apps/inference/whisper/Dockerfile.vllm-base
          context: apps/inference/whisper
          cuda: 'true'
          security-config: apps/inference/whisper/security/trivy.yaml
          evidence-name: runtime-base-security-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          artifact-name: runtime-base-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-base-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.6/oras_1.3.6_linux_amd64.tar.gz
          checksum: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
          token: ''
      - name: Publish the scanned runtime without executing it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          digest=$(python3 -c 'import json,re; x=json.load(open("image/index.json"))["manifests"]; assert len(x)==1; d=x[0]["digest"]; assert re.fullmatch("sha256:[a-f0-9]{64}",d); print(d)')
          python3 .github/scripts/onprem_registry.py vllm-engine
          repository=ghcr.io/videoq-jp/videoq-vllm
          tag="$repository:runtime-base-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          umask 077
          mkdir -p "$HOME/.docker"
          printf '%s' "$GH_TOKEN" | oras login --registry-config "$HOME/.docker/config.json" ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          oras cp --from-oci-layout --to-registry-config "$HOME/.docker/config.json" "image@$digest" "$tag"
          test "$(oras resolve --registry-config "$HOME/.docker/config.json" "$tag")" = "$digest"
          python3 .github/scripts/onprem_registry.py vllm-engine
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign source provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/videoq-jp/videoq-vllm
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Sign the package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/videoq-jp/videoq-vllm
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Record the candidate digest for a reviewed update
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'GPU runtime base candidate: `ghcr.io/videoq-jp/videoq-vllm@%s`\n\nReview a Dockerfile.vllm digest update after GPU verification.\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Clear registry credentials after signing
        if: ${{ always() && (steps.image.outcome == 'success' || steps.image.outcome == 'failure' || steps.image.outcome == 'cancelled') }}
        run: oras logout --registry-config "$HOME/.docker/config.json" ghcr.io
