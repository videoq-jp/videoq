name: On-prem Runtime Base
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: onprem-runtime-base
  cancel-in-progress: false
jobs:
  source:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const validate = require('./.github/scripts/validate-deployment.cjs');
            core.setOutput('sha', await validate({ github, context }));
  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/build-onprem-image
        with:
          image: videoq-vllm-runtime-base:scanned
          dockerfile: apps/inference/whisper/Dockerfile.vllm-base
          context: apps/inference/whisper
          cuda: 'true'
          security-config: apps/inference/whisper/security/trivy.yaml
          evidence-name: runtime-base-security-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          artifact-name: runtime-base-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Reserve disk for the scanned archive
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: runtime-base-${{ github.sha }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
      - name: Configure the disposable Docker OCI image store
        run: python3 .github/scripts/configure-onprem-ci-dns.py --docker --oci
      - name: Publish the scanned runtime without executing it
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zstd -d image.tar.zst --stdout | docker load
          python3 .github/scripts/onprem_registry.py vllm-engine
          repository=ghcr.io/videoq-jp/videoq-vllm
          tag="$repository:runtime-base-$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag videoq-vllm-runtime-base:scanned "$tag"
          docker push "$tag"
          python3 .github/scripts/onprem_registry.py vllm-engine
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$tag")
          digest="${digest#*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign source provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/videoq-jp/videoq-vllm
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
      - name: Sign the package inventory
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ghcr.io/videoq-jp/videoq-vllm
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Record the candidate digest for a reviewed update
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'GPU runtime base candidate: `ghcr.io/videoq-jp/videoq-vllm@%s`\n\nReview a Dockerfile.vllm digest update after GPU verification.\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
