name: Verify Production Migration Ledger
on:
  workflow_dispatch:
    inputs:
      exercise_recovery:
        description: Fail after acquiring ownership on the first attempt; re-run failed jobs to verify recovery before any schema mutation
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'videoq-jp/videoq' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_MAINTENANCE_ENABLED == 'true'
    environment: production-db-migration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STRUCTURED_ANSWER_WRITERS_STOPPED: "0"
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/cloudflare-maintenance-tools
        with:
          purpose: migration
      - name: Exercise failed admission without runtime credentials
        if: inputs.exercise_recovery && github.run_attempt == 1
        env:
          GH_MAINTENANCE_READ_TOKEN: ${{ github.token }}
        run: node .github/scripts/github-maintenance.cjs migration
      - name: Verify the already applied ledger without applying schema
        if: '!inputs.exercise_recovery || github.run_attempt != 1'
        env:
          GH_MAINTENANCE_READ_TOKEN: ${{ github.token }}
          CLOUDFLARE_MAINTENANCE_TOKEN: ${{ secrets.CLOUDFLARE_MAINTENANCE_TOKEN }}
        run: node .github/scripts/github-maintenance.cjs migration
