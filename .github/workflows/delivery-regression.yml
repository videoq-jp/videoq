name: Delivery regression
on:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts-and-cors:
    name: Deployed consumers and browser CORS
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ./.github/actions/setup-package-manager
        with:
          manager: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Configure disposable runner DNS
        run: python3 .github/scripts/configure-onprem-ci-dns.py --docker
      - name: Install checksum-pinned uv for the next step
        run: bash .github/scripts/install-uv.sh
      - name: Install locked fixture dependencies
        run: |
          npm ci --ignore-scripts --workspace @videoq/api --workspace @videoq/web --include-workspace-root
          uv export --quiet --project apps/worker --locked --extra dev --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/worker-requirements.txt"
          uv venv --python "$(command -v python)" "$RUNNER_TEMP/delivery-python"
          uv pip install --python "$RUNNER_TEMP/delivery-python/bin/python" --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/worker-requirements.txt"
      - name: Gate mixed old and candidate consumer deployment
        env:
          COMPATIBILITY_PYTHON: ${{ runner.temp }}/delivery-python/bin/python
        run: node --import tsx .github/scripts/release-compatibility.mjs
      - name: Prove incompatible hash, rejection and replay changes fail the gate
        env:
          COMPATIBILITY_PYTHON: ${{ runner.temp }}/delivery-python/bin/python
          RELEASE_COMPATIBILITY_NEGATIVE_CONTROLS: '1'
        run: node --test .github/scripts/release-compatibility.test.cjs
      - name: Install Chromium with browser protections enabled
        if: ${{ !cancelled() }}
        # Use the same workspace-resolved Playwright as cors-regression.mjs.
        # The root package can have a different locked Chromium revision.
        run: node apps/api/scripts/cors-regression.mjs --install-browser
      - name: Gate actual-browser CORS and multipart integrity
        if: ${{ !cancelled() }}
        env:
          CORS_ACCEPTANCE_PYTHON: ${{ runner.temp }}/delivery-python/bin/python
        run: node apps/api/scripts/cors-regression.mjs
      - name: Retain anonymized delivery evidence including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-regression-${{ github.sha }}
          path: |
            artifacts/cors-browser.json*
            artifacts/release-compatibility.json
          if-no-files-found: error
          retention-days: 30
