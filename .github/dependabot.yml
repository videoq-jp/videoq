version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      github-actions:
        patterns: ["*"]

  # The root lockfile covers every npm workspace in apps/ and packages/.
  - package-ecosystem: npm
    cooldown:
      default-days: 7
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # This exception was added while Cloudflare's Vitest plugin required Vitest 4.
    # @cloudflare/vitest-plugin 1.4.6 accepts Vitest 5 and the repo uses it, so the
    # vitest entries below only hold back 5.x updates and can be reviewed for removal.
    ignore:
      # Docusaurus 3.10.2 resolves ELK through an optional ^0.1.9 peer.
      # Installing 0.2+ nests the package and silently disables ELK layouts.
      - dependency-name: "@mermaid-js/layout-elk"
        versions: [">=0.2.0"]
      - dependency-name: vitest
        versions: [">=5.0.0 <6.0.0"]
      - dependency-name: "@vitest/*"
        versions: [">=5.0.0 <6.0.0"]
    groups:
      # Keep packages with shared versions / peer requirements together,
      # including major upgrades. Other major upgrades get individual PRs.
      # Update the native compiler and compatibility API aliases together.
      typescript:
        patterns: ["typescript", "@typescript/*"]
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
      trpc:
        patterns: ["@trpc/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      storybook:
        patterns: ["storybook", "@storybook/*"]
      docusaurus:
        patterns: ["@docusaurus/*"]
      remotion:
        patterns: ["remotion", "@remotion/*"]
      npm-patch:
        patterns: ["*"]
        update-types: [patch]
      npm-minor:
        patterns: ["*"]
        update-types: [minor]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  # Use uv so that pyproject.toml and the checked-in uv.lock stay in sync.
  - package-ecosystem: uv
    cooldown:
      default-days: 7
    directories:
      - /apps/worker
      - /apps/inference/whisper
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      python-patch:
        patterns: ["*"]
        update-types: [patch]
      python-minor:
        patterns: ["*"]
        update-types: [minor]
      python-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/worker
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    # Runtime Updates coordinates these images with CI and tool hashes.
    # Keep one owner for interpreter pins; other images stay on Dependabot.
    ignore:
      - dependency-name: node
      - dependency-name: python
      - dependency-name: public.ecr.aws/lambda/python
      - dependency-name: ghcr.io/astral-sh/uv
      # Dependabot reports these registry images using normalized names.
      - dependency-name: lambda/python
      - dependency-name: astral-sh/uv
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # This service deliberately keeps Python 3.12 for the native inference wheels;
  # it is independent of the app runtime's coordinated interpreter upgrades.
  - package-ecosystem: docker
    directory: /apps/inference/whisper
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      inference-runtime-patch:
        patterns: ["*"]
        update-types: [patch]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      compose-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/bootstrap
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      terraform-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # Track the optional whisper.cpp checkout, not its vendored dependencies.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 1

  # Deployment tools have their own lockfiles and always require human review.
  - package-ecosystem: "npm"
    directory: "/.github/deploy-tools"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /.github/operations-tools
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Tokyo
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
  - package-ecosystem: docker
    directory: /.github/operations-tools
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
