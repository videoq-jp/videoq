# Candidate: one RTX 4090 + 128 GiB host RAM, three CUDA inference Pods.
# Gemma 4 BF16 uses 40 GiB CPU weight offload; actual GPU acceptance is required.
# Requires the matching NVIDIA time-slicing configuration (three shared slots).
# Use a verified release lock last; hardware/model acceptance remains required.
backend: vllm
gpuSharing:
  enabled: true
  memoryFractions: { chat: 0.66, embedding: 0.07, whisper: 0.12 }
servers:
  chat:
    engine: vllm
    dtype: bfloat16
    modelRepo: google/gemma-4-26B-A4B-it
    modelRevision: 4d7ae4984b7db7de8f8457170b3f1a419ee76d52
    modelFile: ""
    modelSha256: ""
    toolCallParser: gemma4
    reasoningParser: gemma4
    cpuOffloadGb: 40
    contextLength: 8192
    persistence: { size: 70Gi }
    extraArgs: [--max-num-batched-tokens, "512", --limit-mm-per-prompt, '{"image":16,"audio":0,"video":0}', --mm-processor-cache-gb, "0"]
    nodeSelector: { kubernetes.io/arch: amd64, kubernetes.io/os: linux, videoq.io/inference-target: rtx4090 }
    resources:
      requests: { cpu: "4", memory: 80Gi, nvidia.com/gpu.shared: 1 }
      limits: { cpu: "12", memory: 104Gi, nvidia.com/gpu.shared: 1 }
  embedding:
    engine: vllm
    dtype: bfloat16
    servedModel: embeddinggemma-2-f9972ac
    modelRepo: google/embeddinggemma-2
    modelRevision: f9972ac22e696a105c482202646979e33e4b5a1e
    modelFile: ""
    modelSha256: ""
    contextLength: 4096
    persistence: { size: 20Gi }
    # Use EMBEDDING_PROFILE=embeddinggemma2 in both API and worker.
    # Match the reviewed upstream text embedding contract.
    disableTorchCompile: true
    extraArgs: [--limit-mm-per-prompt, '{"image":0,"audio":0,"video":0}', --attention-backend, FLEX_ATTENTION, --pooler-config, '{"use_activation":true}']
    nodeSelector: { kubernetes.io/arch: amd64, kubernetes.io/os: linux, videoq.io/inference-target: rtx4090 }
    resources:
      requests: { cpu: "1", memory: 2Gi, nvidia.com/gpu.shared: 1 }
      limits: { cpu: "4", memory: 6Gi, nvidia.com/gpu.shared: 1 }
whisper:
  backend: vllm
  modelRepo: openai/whisper-large-v3-turbo
  modelRevision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
  modelFile: ""
  modelSha256: ""
  persistence: { size: 10Gi }
  maxConcurrentRequests: 1
  upstreamParallelism: 1
  requestTimeoutSeconds: 600
  maxSequences: 1
  nodeSelector: { kubernetes.io/arch: amd64, kubernetes.io/os: linux, videoq.io/inference-target: rtx4090 }
  resources:
    requests: { cpu: "1", memory: 2Gi, nvidia.com/gpu.shared: 1 }
    limits: { cpu: "4", memory: 6Gi, nvidia.com/gpu.shared: 1 }
