# Default fully local model selection for new installations.
# Three dedicated NVIDIA GPUs: one per model, using the upstream vLLM image.
backend: vllm
servers:
  chat:
    engine: vllm
    servedModel: videoq-chat
    modelRepo: openai/gpt-oss-20b
    modelRevision: 6cee5e81ee83917806bbde320786a8fb61efebee
    modelFile: ""
    modelSha256: ""
    toolCallParser: openai
    reasoningParser: openai_gptoss
    contextLength: 8192
    persistence: { size: 20Gi }
    nodeSelector: { kubernetes.io/arch: amd64 }
    extraArgs: [--gpu-memory-utilization, "0.85", --max-num-seqs, "2"]
    resources:
      requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "8", memory: 16Gi, nvidia.com/gpu: 1 }
  embedding:
    engine: vllm
    servedModel: embeddinggemma-2-f9972ac
    modelRepo: google/embeddinggemma-2
    modelRevision: f9972ac22e696a105c482202646979e33e4b5a1e
    modelFile: ""
    modelSha256: ""
    contextLength: 8192
    cpuThreads: 2
    nodeSelector: { kubernetes.io/arch: amd64 }
    # FlexAttention supports the 512-wide bidirectional heads on L40S.
    # Disable nested torch.compile too: FlexAttention compiles its masks itself.
    disableTorchCompile: true
    extraArgs: [--gpu-memory-utilization, "0.85", --max-num-seqs, "8", --attention-backend, FLEX_ATTENTION, --enforce-eager, --pooler-config, '{"use_activation":true}']
    persistence: { size: 5Gi }
    resources:
      requests: { cpu: "1", memory: 4Gi, nvidia.com/gpu: 1 }
      limits: { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
# One additional dedicated NVIDIA GPU for speech. No GPU sharing.
# The CPU gateway performs VAD/normalization; vLLM dynamically batches speech.
whisper:
  backend: vllm
  modelRepo: openai/whisper-large-v3-turbo
  modelRevision: 41f01f3fe87f28c78e2fbf8b568835947dd65ed9
  modelFile: ""
  modelSha256: ""
  maxConcurrentRequests: 2
  upstreamParallelism: 4
  requestTimeoutSeconds: 110
  maxSequences: 8
  persistence: { size: 10Gi }
  resources:
    requests: { cpu: "2", memory: 8Gi, nvidia.com/gpu: 1 }
    limits: { cpu: "4", memory: 16Gi, nvidia.com/gpu: 1 }
  nodeSelector: { kubernetes.io/arch: amd64 }
