{{- if and .Values.networkPolicy.denyEgress .Values.downloadModels }}
{{- fail "networkPolicy.denyEgress requires downloadModels=false and pre-provisioned models" }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "inference.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: videoq-inference
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.denyEgress }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.clientNamespace | quote }} }
          podSelector:
            matchLabels:
              app.kubernetes.io/name: videoq
              app.kubernetes.io/instance: {{ .Values.networkPolicy.clientRelease | quote }}
            matchExpressions:
              - { key: app.kubernetes.io/component, operator: In, values: [api, worker] }
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 8080 }
  {{- if .Values.gpuSharing.enabled }}
    # Readiness dependencies serialize model startup on the shared device.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: videoq-inference
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 8080 }
  {{- end }}
  {{- if .Values.networkPolicy.denyEgress }}
  {{- if .Values.gpuSharing.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: videoq-inference
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
  {{- else }}
  egress: []
  {{- end }}
  {{- end }}
{{- end }}
