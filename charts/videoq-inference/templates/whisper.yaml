{{- $whisper := .Values.whisper }}
{{- $gpu := eq $whisper.backend "vllm" }}
{{- include "inference.validateSharing" (dict "root" . "engine" $whisper.backend "resources" $whisper.resources "extraArgs" list) }}
{{- $cpuArch := .Values.whispercpp.architecture }}
{{- $cpuImage := index .Values.whispercpp.images $cpuArch }}
{{- if and (not $gpu) (hasKey $whisper.nodeSelector "kubernetes.io/arch") (ne (index $whisper.nodeSelector "kubernetes.io/arch") $cpuArch) }}
{{- fail "whisper.nodeSelector architecture must match whispercpp.architecture" }}
{{- end }}
{{- $gpuCount := int (default 0 (index $whisper.resources.limits "nvidia.com/gpu")) }}
{{- if and $gpu (not .Values.gpuSharing.enabled) (ne $gpuCount 1) }}
{{- fail "NVIDIA Whisper requires exactly one GPU in whisper.resources.limits" }}
{{- end }}
{{- if and (not $gpu) (ne $gpuCount 0) }}
{{- fail "CPU Whisper must not reserve an NVIDIA GPU; select whisper.backend=vllm" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference.fullname" . }}-whisper
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: whisper }
  template:
    metadata:
      annotations:
        videoq.io/model-revision: {{ $whisper.modelRevision | quote }}
      labels:
        {{- include "inference.labels" . | nindent 8 }}
        app.kubernetes.io/component: whisper
    spec:
      automountServiceAccountToken: false
      {{- if .Values.gpuSharing.enabled }}
      runtimeClassName: {{ .Values.gpuSharing.runtimeClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      {{- $selector := deepCopy $whisper.nodeSelector }}
      {{- if not $gpu }}
      {{- $_ := set $selector "kubernetes.io/arch" $cpuArch }}
      {{- end }}
      {{- with $selector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $whisper.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.downloadModels .Values.gpuSharing.enabled }}
      initContainers:
        {{- if .Values.gpuSharing.enabled }}
        {{- include "inference.sharedWait" (dict "root" . "role" "whisper") | nindent 8 }}
        {{- end }}
        {{- if .Values.downloadModels }}
        - name: provision-model
          image: {{ include "inference.image" (dict "root" . "image" $whisper.image "component" "whisper") | quote }}
          imagePullPolicy: {{ $whisper.image.pullPolicy }}
          command: [python, provision.py]
          env:
            - { name: MODEL_REPO, value: {{ $whisper.modelRepo | quote }} }
            - { name: MODEL_REVISION, value: {{ $whisper.modelRevision | quote }} }
            - { name: MODEL_FILE, value: {{ $whisper.modelFile | quote }} }
            - { name: MODEL_SHA256, value: {{ $whisper.modelSha256 | quote }} }
            - { name: HF_HUB_OFFLINE, value: "0" }
          securityContext: {{ include "inference.security" . | nindent 12 }}
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 1Gi } }
          volumeMounts: [{ name: models, mountPath: /models }]
        {{- end }}
      {{- end }}
      containers:
        - name: whisper
          # The gateway alone is reachable through the Service and NetworkPolicy.
          image: {{ include "inference.image" (dict "root" . "image" $whisper.image "component" "whisper") | quote }}
          imagePullPolicy: {{ $whisper.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: WHISPER_MAX_CONCURRENT_REQUESTS, value: {{ $whisper.maxConcurrentRequests | quote }} }
            - { name: WHISPER_UPSTREAM_PARALLELISM, value: {{ $whisper.upstreamParallelism | quote }} }
            - { name: WHISPER_REQUEST_TIMEOUT_SECONDS, value: {{ $whisper.requestTimeoutSeconds | quote }} }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
          startupProbe: { httpGet: { path: /health, port: http }, periodSeconds: 5, failureThreshold: 120 }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /live, port: http }, periodSeconds: 30 }
          securityContext: {{ include "inference.security" . | nindent 12 }}
          resources: {{ toYaml $whisper.gatewayResources | nindent 12 }}
          volumeMounts: [{ name: models, mountPath: /models, readOnly: true }]
        - name: engine
          {{- if $gpu }}
          image: {{ include "inference.image" (dict "root" . "image" $whisper.vllmImage "component" "whisper.vllmImage") | quote }}
          imagePullPolicy: {{ $whisper.vllmImage.pullPolicy }}
          command: [vllm, serve]
          args:
            - /models/{{ $whisper.modelRevision }}
            - --served-model-name
            - whisper-local
            - --host
            - "127.0.0.1"
            - --port
            - "8081"
            - --dtype
            - float16
            - --gpu-memory-utilization
            - {{ ternary (.Values.gpuSharing.memoryFractions.whisper | toString) "0.70" .Values.gpuSharing.enabled | quote }}
            {{- if .Values.gpuSharing.enabled }}
            - --cpu-offload-gb
            - "0"
            - --enforce-eager
            {{- end }}
            - --max-num-seqs
            - {{ $whisper.maxSequences | quote }}
          {{- else }}
          image: {{ include "inference.image" (dict "root" . "image" $cpuImage "component" "whispercpp") | quote }}
          imagePullPolicy: {{ $cpuImage.pullPolicy }}
          command: [/app/build/bin/whisper-server]
          args:
            - --model
            - /models/{{ $whisper.modelRevision }}/{{ $whisper.modelFile }}
            - --tmp-dir
            - /tmp
            - --host
            - "127.0.0.1"
            - --port
            - "8081"
            - --inference-path
            - /v1/audio/transcriptions
            - --language
            - auto
            - --threads
            - {{ $whisper.cpuThreads | quote }}
            - --beam-size
            - "5"
            - --no-gpu
          {{- end }}
          env:
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
            - { name: VLLM_NO_USAGE_STATS, value: "1" }
            - { name: DO_NOT_TRACK, value: "1" }
            - { name: HOME, value: /tmp }
          securityContext: {{ include "inference.security" . | nindent 12 }}
            {{- if not $gpu }}
            readOnlyRootFilesystem: true
            {{- end }}
          resources: {{ toYaml $whisper.resources | nindent 12 }}
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            {{- if not $gpu }}
            - { name: tmp, mountPath: /tmp }
            {{- end }}
            {{- if $gpu }}
            - { name: shm, mountPath: /dev/shm }
            {{- end }}
      volumes:
        {{- if not $gpu }}
        - name: tmp
          emptyDir: { sizeLimit: 256Mi }
        {{- end }}
        - name: models
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-whisper" (include "inference.fullname" .)) $whisper.persistence.existingClaim }}
        {{- if $gpu }}
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
        {{- end }}
