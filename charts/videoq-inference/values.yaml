# Select llamacpp or vllm; application endpoints use a matching overlay.
backend: llamacpp
fullnameOverride: videoq-inference
imagePullSecrets: []
requireImageDigests: false
# First installation downloads model weights. Cached restarts do not pull again.
# Set false after provisioning, or when using pre-populated existing claims.
downloadModels: true

whisper:
  # Signed release verification supplies the immutable digest.
  image:
    repository: ghcr.io/videoq-jp/videoq-transcription-gateway
    tag: "0.2.0-cpu"
    digest: ""
    pullPolicy: IfNotPresent
  # CPU transcription engine. NVIDIA overlay selects vllm, without aliases.
  backend: whispercpp
  modelRepo: ggerganov/whisper.cpp
  modelRevision: 5359861c739e955e79d9a303bcbc70fb988958b1
  modelFile: ggml-large-v3-turbo-q5_0.bin
  modelSha256: 394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2
  cpuThreads: 2
  maxConcurrentRequests: 1
  upstreamParallelism: 1
  requestTimeoutSeconds: 600
  maxSequences: 8
  gatewayResources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { cpu: "1", memory: 2Gi }
  persistence:
    existingClaim: ""
    storageClass: ""
    size: 5Gi
  resources:
    requests: { cpu: "2", memory: 1Gi }
    limits: { cpu: "2", memory: 2Gi }
  nodeSelector: {}
  tolerations: []

networkPolicy:
  enabled: true
  # Inference APIs have no public ingress or LoadBalancer. Only this VideoQ
  # Helm release in this namespace may connect (API / worker components).
  clientNamespace: videoq
  clientRelease: videoq
  # Requires downloadModels=false and a CNI that enforces NetworkPolicy.
  denyEgress: false

# OpenAI-compatible servers use separate chat / embedding Pods and caches.
# Model provisioning reuses the signed whisper.image (provision.py).
llamacpp:
  image:
    repository: ghcr.io/ggml-org/llama.cpp
    tag: server-b11977
    digest: sha256:01c2bc28d51291536df2ccebe5c6af1cdec9ea9b2bd98ac59556408caf96d3f8
    pullPolicy: IfNotPresent
whispercpp:
  architecture: amd64
  images:
    amd64:
      repository: ghcr.io/ggml-org/whisper.cpp
      tag: main
      digest: sha256:0b39b82d8febd2708a5abd2e3d8d373620604d558922f2cf921b7f4c365e6c73
      pullPolicy: IfNotPresent
    arm64:
      repository: ghcr.io/ggml-org/whisper.cpp
      tag: main-arm64
      digest: sha256:f0fed3d3d54565cb37d2995fcaa28ca09a5c9f3ffb7fada2d790099af2bfeee0
      pullPolicy: IfNotPresent
vllm:
  image:
    repository: vllm/vllm-openai
    tag: v0.33.0
    digest: sha256:91ee972ab751fb7180bc71c175865e36b091686600dca783d52b2511399810b3
    pullPolicy: IfNotPresent
servers:
  chat:
    servedModel: videoq-chat
    modelRepo: Qwen/Qwen3-4B-GGUF
    modelRevision: bc640142c66e1fdd12af0bd68f40445458f3869b
    modelFile: Qwen3-4B-Q4_K_M.gguf
    modelSha256: 7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
    contextLength: 8192
    cpuThreads: 4
    disableTorchCompile: false
    extraArgs: []
    persistence: { existingClaim: "", storageClass: "", size: 10Gi }
    resources:
      requests: { cpu: "2", memory: 4Gi }
      limits: { cpu: "4", memory: 8Gi }
    nodeSelector: {}
    tolerations: []
  embedding:
    # Native 1536 dimensions. llama.cpp does not implement dimensions reduction.
    servedModel: gte-qwen2-1.5b-q4km-124fbdad
    modelRepo: second-state/gte-Qwen2-1.5B-instruct-GGUF
    modelRevision: 124fbdad7d80e987f3a4d8cd201f721ca37fe9b8
    modelFile: gte-Qwen2-1.5B-instruct-Q4_K_M.gguf
    modelSha256: a40df5cabb8c70f2fa144bc6a8674c2c987bfe3b4571134c767832aae1d246b9
    contextLength: 8192
    cpuThreads: 2
    disableTorchCompile: false
    extraArgs: []
    persistence: { existingClaim: "", storageClass: "", size: 5Gi }
    resources:
      requests: { cpu: "1", memory: 2Gi }
      limits: { cpu: "2", memory: 4Gi }
    nodeSelector: {}
    tolerations: []

# Explicit shared GPU resource; default deployments still reserve whole GPUs.
gpuSharing:
  enabled: false
  runtimeClassName: nvidia
  memoryFractions: { chat: 0.25, embedding: 0.43, whisper: 0.12 }
