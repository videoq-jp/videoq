# Infrastructure is supplied by the operator; no DB/storage/inference subcharts.
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
# Enable for production after recording reviewed registry digests for all images.
requireImageDigests: false
publicUrl: ""
# Create this Secret before installing. See README for the required keys.
existingSecret: "videoq-runtime"

api:
  image: { repository: videoq-api, tag: "0.1.0", digest: "", pullPolicy: IfNotPresent }
  replicas: 1
  databasePoolMax: 10
  rateLimitPoolMax: 2
  # Set to the exact number of trusted HTTP proxies. Zero uses the TCP peer.
  trustedProxyHops: 0
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []

web:
  image: { repository: videoq-web, tag: "0.1.0", digest: "", pullPolicy: IfNotPresent }
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 32Mi }
    limits: { memory: 128Mi }

worker:
  image: { repository: videoq-worker, tag: "0.1.0", digest: "", pullPolicy: IfNotPresent }
  replicas: 1
  terminationGracePeriodSeconds: 960
  resources:
    requests: { cpu: "1", memory: 1Gi }
    limits: { cpu: "2", memory: 4Gi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []

storage:
  bucket: videoq-media
  # Browser-reachable S3 endpoint. Configure bucket CORS for publicUrl.
  endpoint: ""
  internalEndpoint: ""
  region: garage

queue:
  # Existing persistent SQS-compatible queue, with retries and a dead-letter queue.
  url: ""
  region: us-east-1

ai:
  # Non-secret policy ID enables AWS workload identity; runtime needs an AWS identity.
  federationPolicyId: ""
  federationAudience: https://openrouter.ai
  openaiBaseUrl: https://openrouter.ai/api/v1
  # Answer generation and image inspection only; empty retains openaiBaseUrl.
  llmBaseUrl: ""
  # Supply LLM_API_KEY through the existing Secret.
  llmModel: openai/gpt-6-luna
  reasoningEffort: ""
  separateToolSchema: false
  preserveToolReasoning: false
  requestTimeoutMs: 120000
  streamTimeoutMs: 300000
  # OpenAI-compatible embedding service; empty reuses openaiBaseUrl.
  embeddingBaseUrl: ""
  embeddingModel: openai/text-embedding-3-small
  embeddingProfile: openai
  whisperBackend: openrouter
  # CPU overlay reduces this to 30; hosted/NVIDIA profiles use 300.
  whisperChunkSeconds: 300
  whisperLocalUrl: ""
  # Match the served alias when using an existing compatible speech service.
  whisperLocalModel: whisper-local

# Enable with local AI. The site's CNI must enforce Kubernetes NetworkPolicy.
networkPolicy:
  localEgressOnly: false
  # The release's own namespace is always allowed. Add infrastructure namespaces
  # or intranet CIDRs for DB, S3, queue, SMTP and inference outside it.
  allowedNamespaces: []
  allowedCIDRs: []

config:
  maxVideoUploadSizeMb: 200
  videoVisualEnabled: true
  defaultFromEmail: noreply@videoq.local

migration:
  enabled: true
  activeDeadlineSeconds: 900

maintenance:
  recoverySchedule: "* * * * *"
  retentionSchedule: "17 3 * * *"
  activeDeadlineSeconds: 600

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []
